name: Publish Java SDK

on:
  push:
    branches: [main, dev]
    tags: ["sdk-v*"]
  pull_request:
    branches: [main, dev]

jobs:
  publish-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD

      - name: Build and test (dry-run)
        working-directory: java
        run: mvn -B clean test compile

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        working-directory: java
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#sdk-v}"
          mvn -B versions:set -DnewVersion=$VERSION -DprocessAllModules

      - name: Deploy to Maven Central
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        working-directory: java
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          mvn -B clean deploy -Prelease -DskipTests
