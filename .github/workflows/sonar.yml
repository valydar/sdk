name: SonarQube

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonar:
    runs-on: [self-hosted, valydar-sdk-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Cache SonarScanner CLI
        uses: actions/cache@v4
        with:
          path: ~/.sonar
          key: sonar-scanner-8.1.0.6389

      - name: Install SonarScanner CLI
        run: |
          if [ ! -f ~/.sonar/sonar-scanner-8.1.0.6389-linux-x64/bin/sonar-scanner ]; then
            mkdir -p ~/.sonar
            curl -fsSL -o /tmp/sonar-scanner.zip \
              https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip
            unzip -q -o /tmp/sonar-scanner.zip -d ~/.sonar
          fi
          echo "$HOME/.sonar/sonar-scanner-8.1.0.6389-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Run SonarScanner
        continue-on-error: true
        run: sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_SCANNER_JAVA_OPTS: -Xmx1024m

      - name: Enforce SonarQube quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          curl -sf -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=valydar_sdk" \
            | python3 -c 'import json,sys; ps=json.load(sys.stdin)["projectStatus"]; print("gate: " + ", ".join("%s=%s" % (c["metricKey"], c["status"]) for c in ps["conditions"])); bad=[c["metricKey"] for c in ps["conditions"] if c["status"]=="ERROR" and c["metricKey"]!="new_coverage"]; (print("::error::quality gate failed on: " + ", ".join(bad)) or sys.exit(1)) if bad else print("quality gate OK (new_coverage exempt per sdk#36)")'
